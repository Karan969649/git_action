<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple complex h bhai Interactive Website demo v2</title>
    
    <!-- 1. CSS STYLING GOES HERE -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .counter-display {
            font-size: 3rem;
            font-weight: bold;
            color: #007BFF;
            margin: 20px 0;
        }

        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- 2. HTML STRUCTURE GOES HERE -->
    <div class="card">
        <h1>Welcome! Sujeet Sir Apka Swagat hai Hamare Website me </h1>
        <p>Happy Diwali </p>
        <div class="counter-display" id="counter">0</div>
        <button id="clickBtn">Ones More</button>
    </div>

    <!-- 3. JAVASCRIPT CODE GOES HERE -->
    <script>
        // Get elements from the DOM
        const button = document.getElementById('clickBtn');
        const counterDisplay = document.getElementById('counter');

        // Initialize counter variable
        let count = 0;

        // Add click event listener to the button
        button.addEventListener('click', () => {
            count++; // Increase count by 1
            counterDisplay.textContent = count; // Update screen text
        });
    </script>

</body>
</html>
